  - title: 'A new upper bound on the dimer constant of $\mathbb{Z}^3$'
    authors: <strong>Qidong He</strong>
    # journal_short: arXiv
    journal: arXiv preprint, 2026
    arXiv: https://arxiv.org/abs/2607.28810
    abstract: 'I show that the dimer constant of the cubic lattice is bounded above by $0.452130$, improving the previous best upper bound of $0.457547$ obtained by Lundow (2001).'
  
  - title: 'Rigorous bound on the aspect ratio for the formation of a nematic phase in hard rod and hard rectangle systems on $\mathbb{Z}^2$'
    authors: <strong>Qidong He</strong>
    # journal_short: arXiv
    journal: arXiv preprint, 2026
    arXiv: https://arxiv.org/abs/2607.10510
    image: ./assets/img/nematic-rectangle.png
    abstract: 'I derive what appears to be the first rigorous numerical bound on the aspect ratio ($k$) required for the formation of a nematic phase in hard rectangle systems on the square lattice by synthesizing the approaches of Disertori–Giuliani (2013) and Disertori–Giuliani–Jauslin (2020). Between my result ($k\ge 10^{72}$) and the physical prediction ($k\ge 7$) due to Ghosh–Dhar (2007) and Kundu–Rajesh (2014, 2015), there is still a very long way to go.'

  - title: 'Unified criteria for crystallization in hard-core lattice systems with applications to polyomino fluids and multi-component systems'
    authors: <strong>Qidong He</strong>
    # journal_short: arXiv
    journal: arXiv preprint, 2026
    arXiv: https://arxiv.org/abs/2602.05294
    image: ./assets/img/post-transition.png
    # notes: "image: Monte Carlo simulation by Barnes (2010)"
    abstract: 'I extend the characterization of local order in He–Jauslin (2024) to give a set of criteria for low-temperature crystallization in multi-component systems.'

  - title: 'Extended regime of nematic order in an interacting monomer-dimer model of Heilmann and Lieb'
    authors: <strong>Qidong He</strong>
    # journal_short: arXiv
    journal: arXiv preprint, 2025
    arXiv: https://arxiv.org/abs/2511.23437v3
    image: ./assets/img/dimer_post-transition.png
    abstract: 'I prove that a two-dimensional model for liquid crystals introduced by Heilmann–Lieb (Model I, 1979) exhibits nematic order over a much larger parameter regime than previously known (Jauslin–Lieb, 2018). The proof relies on the abstract framework of strongly percolating sets developed by Hadas–Peled (2026) in their recent study of the $2\times 2$ hard square model.'
    
